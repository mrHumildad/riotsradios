name: Stream health

on:
  schedule:
    # Daily, off-peak; GitHub cron is UTC.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe every station
        run: npm run probe:health

      - name: Commit the fresh snapshot
        run: |
          if git diff --quiet -- data/health.json; then
            echo "Health snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          git commit -m "chore(health): refresh stream status snapshot"
          git push
