name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate station catalog
        run: npm run validate:stations

      # The published catalog belongs to riotsradios-epg; this fails when the
      # snapshot committed here has drifted from it (exit 2). A network failure
      # only warns, so an offline run does not turn into a red build.
      - name: Check the catalog snapshot against the published feed
        run: npm run catalog:check

      - name: Validate EPG files
        run: npm run validate:epg

      - name: Production build
        run: npm run build
