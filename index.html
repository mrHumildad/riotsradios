<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Community Radio Player</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --muted-color: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted-color);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Player Control Dashboard */
        .player-dashboard {
            background-color: var(--card-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            position: sticky;
            top: 10px;
            z-index: 10;
            border: 1px solid #2a2a2a;
        }

        #current-station {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: black;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        button.stop-btn {
            background-color: #e15b64;
            color: white;
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted-color);
            font-size: 0.85rem;
        }

        input[type="range"] {
            accent-color: var(--accent-color);
            width: 150px;
        }

        /* Station List Styling */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .station-item {
            background-color: var(--card-color);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
            border-left: 4px solid transparent;
        }

        .station-item:hover {
            background-color: #282828;
        }

        .station-item.playing {
            border-left-color: var(--accent-color);
            background-color: #252525;
        }

        .station-info text {
            font-weight: bold;
            display: block;
        }

        .station-location {
            font-size: 0.8rem;
            color: var(--muted-color);
            margin-top: 2px;
        }

        .play-icon {
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .station-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .homepage-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .homepage-btn:hover {
            background-color: #555;
        }

        .volume-icon {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

            <div id="current-station">Select a station to begin</div>
            <div class="controls">

                <button class="stop-btn" onclick="stopRadio()">Stop</button>
            </div>
            <div class="volume-container">
                <span class="volume-icon">&#128266;</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" oninput="changeVolume(this.value)">
                <span class="volume-icon">&#128265;</span>
            </div>
        </div>

        <!-- Station Tracklist -->

        // Web Audio Core Setup
        const audio = new Audio();
        let currentStationIndex = null;

        // Render station list elements systematically
        const container = document.getElementById('station-list-container');
        stations.forEach((station, index) => {
            const div = document.createElement('div');
            console.log(`Adding station: ${station.name} at index ${index}`);
            div.className = 'station-item';
            div.id = `station-${index}`;
            div.onclick = () => selectStation(index);
            const iconHtml = station.icon
                ? `<img src="${station.icon}" alt="${station.name} icon" class="station-icon" onerror="this.style.display='none'">`
                : '';
            const homepageHtml = station.webpage
                ? `<a href="${station.webpage}" target="_blank" rel="noopener noreferrer" class="homepage-btn" onclick="event.stopPropagation()">Homepage</a>`
                : '';
            div.innerHTML = `
                <img src="${station.icon || ''}" alt="${station.name}" class="station-icon"
                     onerror="this.style.display='none'" 
                     onload="this.style.display='inline'" 
                     style="display:none">
                <div class="station-info">
                    <strong>${index + 1}. ${station.name}</strong>
                    <div class="station-location">${station.location}</div>
                </div>
                ${homepageHtml}
                <div class="play-icon">▶</div>
            `;
            div.children[0].style.display = station.icon ? '' : 'none';
            container.appendChild(div);
        });

        function selectStation(index) {
            // Manage UI active states
            if (currentStationIndex !== null) {
                document.getElementById(`station-${currentStationIndex}`).classList.remove('playing');
            }
            
            currentStationIndex = index;
            const target = stations[index];
            
            document.getElementById(`station-${index}`).classList.add('playing');
            document.getElementById('current-station').innerText = `Playing: ${target.name}`;
            
            // Assign direct stream source URL
            audio.src = target.url;
            audio.play()
                .then(() => updatePlaybackUI(true))
                .catch(err => {
                    document.getElementById('current-station').innerText = "Stream unavailable or blocked by HTTP/HTTPS restrictions";
                    console.error("Playback error: ", err);
                });
        }

        function togglePlay() {
            if (currentStationIndex === null) return;
            if (audio.paused) {
                audio.play();
                updatePlaybackUI(true);
            } else {
                audio.pause();
                updatePlaybackUI(false);
            }
        }

        function stopRadio() {
            audio.pause();
            audio.src = ""; // Flushes buffer instantly to kill network download data
            updatePlaybackUI(false);
            if (currentStationIndex !== null) {
                document.getElementById(`station-${currentStationIndex}`).classList.remove('playing');
            }
            currentStationIndex = null;
            document.getElementById('current-station').innerText = "Select a station to begin";
        }

        function changeVolume(volume) {
            audio.volume = volume;
        }

        function updatePlaybackUI(isPlaying) {
            const playBtn = document.getElementById('play-pause-btn');
            playBtn.innerText = isPlaying ? "Pause" : "Play";
        }
