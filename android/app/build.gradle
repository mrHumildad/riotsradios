apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Upload signing (see .agents/skills/play-release/SKILL.md). The four properties
// live in the user-level ~/.gradle/gradle.properties, never in this repo. Play App
// Signing holds the real app-signing key: this keystore is only the upload key.
def uploadStoreFile = providers.gradleProperty('RIOTS_UPLOAD_STORE_FILE').orNull
def uploadKeyAlias = providers.gradleProperty('RIOTS_UPLOAD_KEY_ALIAS').orNull
def uploadStorePassword = providers.gradleProperty('RIOTS_UPLOAD_STORE_PASSWORD').orNull
def uploadKeyPassword = providers.gradleProperty('RIOTS_UPLOAD_KEY_PASSWORD').orNull

android {
    namespace = "com.mrhumildad.riotsradios"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mrhumildad.riotsradios"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is bumped by scripts/release-android.mjs; never reuse a number.
        versionCode 4
        // package.json is the single source of versionName (see the play-release
        // skill); the Gradle file never holds its own copy.
        versionName new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadStoreFile) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Gradle would happily emit an unsigned release artifact and the mistake would
// only surface as a Play Console rejection later. Fail here instead.
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach { task ->
    task.doFirst {
        def required = [
            'RIOTS_UPLOAD_STORE_FILE'    : uploadStoreFile,
            'RIOTS_UPLOAD_KEY_ALIAS'     : uploadKeyAlias,
            'RIOTS_UPLOAD_STORE_PASSWORD': uploadStorePassword,
            'RIOTS_UPLOAD_KEY_PASSWORD'  : uploadKeyPassword,
        ]
        def missing = required.findAll { key, value -> !value }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is not configured: missing " +
                "${missing.join(', ')} in ~/.gradle/gradle.properties " +
                "(see .agents/skills/play-release/SKILL.md).")
        }
        if (!file(uploadStoreFile).exists()) {
            throw new GradleException("Upload keystore not found: ${uploadStoreFile}")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Media3 owns playback on Android (docs/ANDROID-AUTO.md M1): the player,
    // the media session that survives the screen going off, and the PCM tap.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
